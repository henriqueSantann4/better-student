[package]
name = "better-student"
version = "1.0.0"
description = "App de desktop leve para estudantes de graduação"
authors = ["Antonio Barbieri e contribuidores"]
license = "MIT"
edition = "2021"

[lib]
# O sufixo _lib evita conflito de nome com o binário no Windows.
name = "better_student_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Banco local. Só abre o arquivo e roda as migrations; as consultas vêm do TypeScript.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Abrir links no navegador do sistema (o assistente do e-mail usa para ir às
# páginas da conta Google). A permissão é restrita em capabilities/default.json.
tauri-plugin-opener = "2"
# E-mail institucional por IMAP (só leitura), com a senha de app no cofre do SO.
imap = "2.4"
native-tls = "0.2"
mail-parser = "1"
keyring = "4"
# Login do Moodle (mesmo fluxo do app oficial): decodificar e conferir a chave.
base64 = "0.22"
md-5 = "0.10"
getrandom = "0.3"
# Download dos arquivos do Moodle para a pasta de materiais. Cliente HTTP
# pequeno, usando o mesmo TLS do Windows do e-mail (native-tls).
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[profile.release]
# Prioriza um executável pequeno, de acordo com a proposta de app leve.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
